{% extends "base.html" %}

{% block content %}
<div class="hero">
    <h1 class="hero-title">Experience the <span class="accent">Future</span> of Shopping</h1>
    <p class="hero-subtitle">Discover premium products curated just for you.</p>
</div>

<div class="container">
    <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
        <h2>Products</h2>
        <div style="display: flex; gap: 0.5rem; width: 100%; max-width: 400px;">
            <input type="text" id="search-input" placeholder="Search for products..." style="flex-grow: 1; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-color); color: var(--text);">
            <button class="btn btn-primary" onclick="handleSearch()">Search</button>
        </div>
    </div>
    
    <div style="display: flex; gap: 1rem; margin-bottom: 2rem; overflow-x: auto; padding-bottom: 0.5rem;" id="category-pills">
        <button class="btn btn-primary" onclick="setCategory('')">All</button>
        <button class="btn btn-ghost" onclick="setCategory('Electronics')">Electronics</button>
        <button class="btn btn-ghost" onclick="setCategory('Gaming')">Gaming</button>
        <button class="btn btn-ghost" onclick="setCategory('Office')">Office</button>
        <button class="btn btn-ghost" onclick="setCategory('Other')">Other</button>
    </div>
    
    <div id="products-grid" class="products-grid">
        <!-- Products will be injected here via JS -->
    </div>
    
    <div id="pagination-controls" style="display: flex; justify-content: center; gap: 1rem; margin-top: 3rem;">
        <!-- Pagination injected here -->
    </div>
</div>

<!-- Product Details Modal -->
<div id="product-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; justify-content:center; align-items:center; backdrop-filter: blur(5px);">
    <div class="glass-panel" style="width: 90%; max-width: 800px; max-height: 90vh; overflow-y: auto; position: relative; padding: 2rem;">
        <button onclick="document.getElementById('product-modal').style.display='none'" style="position:absolute; top:1rem; right:1rem; background:none; border:none; color:var(--text); font-size:1.5rem; cursor:pointer;">&times;</button>
        <div id="modal-content"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener("DOMContentLoaded", () => {
        fetchProducts();
    });
</script>
{% endblock %}
