{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="section-header">
        <h2>Your Cart</h2>
    </div>
    
    <div class="cart-layout">
        <div class="cart-items v-stack" id="cart-items">
            <!-- Cart items injected here -->
        </div>
        
        <div class="cart-summary glass-panel">
            <h3>Order Summary</h3>
            <div class="summary-row">
                <span>Subtotal</span>
                <span id="cart-subtotal">$0.00</span>
            </div>
            <div class="summary-row">
                <span>Shipping</span>
                <span>Free</span>
            </div>
            <div class="summary-divider"></div>
            <div class="summary-row total-row">
                <span>Total</span>
                <span id="cart-total" class="accent-text">$0.00</span>
            </div>
            <button id="checkout-btn" class="btn btn-primary btn-block mt-4">Proceed to Checkout</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener("DOMContentLoaded", () => {
        fetchCart();
        document.getElementById('checkout-btn').addEventListener('click', handleCheckout);
    });
</script>
{% endblock %}
